<!DOCTYPE html>
<html lang="en-AU">
<head>
	<meta charset="UTF-8" />
	<title>{% if page.title %}{% if page.title contains 'selfdriven Network' %}{{ page.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}{% else %}{{ site.title }}{% endif %}</title>
	<meta name="description" content="{{ page.description | default: site.description }}" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<link rel="shortcut icon" href="/assets/img/selfdriven-logo-round-blackcurrant-flamingo.png">
	<link rel="apple-touch-icon" href="/assets/img/selfdriven-logo-round-blackcurrant-flamingo.png" />
	<meta property="og:title" content="{{ page.title | default: site.title }}" />
	<meta property="og:description" content="{{ page.description | default: site.description }}" />
	<meta property="og:type" content="website" />
	{% if page.image %}<meta property="og:image" content="{{ page.image }}" />{% endif %}
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include network-header.html %}

	<main class="main-content" id="main">
{{ content }}
	</main>

{% include network-footer.html %}
</body>
</html>
